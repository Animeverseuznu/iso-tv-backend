<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ISO TV — Admin V2</title>
<link rel="stylesheet" href="admin.css">
</head>

<body>

<header class="topbar">
    <div>
        <div class="logo">ISO<span>TV</span></div>
        <div class="subtitle">ADMIN PANEL V2</div>
    </div>

    <button class="refresh" onclick="loadDashboard()">↻</button>
</header>

<main>

<section class="dashboard">

    <div class="stat">
        <span>🎬</span>
        <b id="totalMovies">0</b>
        <small>Jami kino</small>
    </div>

    <div class="stat vip-stat">
        <span>👑</span>
        <b id="vipMovies">0</b>
        <small>VIP kino</small>
    </div>

    <div class="stat">
        <span>⭐</span>
        <b id="averageRating">0</b>
        <small>O‘rtacha reyting</small>
    </div>

    <div class="stat">
        <span>🆓</span>
        <b id="freeMovies">0</b>
        <small>Free kino</small>
    </div>

</section>

<section class="panel">

    <div class="panel-title">
        <div>
            <h2 id="formTitle">🎬 Kino qo‘shish</h2>
            <p>ISO TV katalogiga yangi kino qo‘shing</p>
        </div>
    </div>

    <input type="hidden" id="movieId">

    <div class="form-grid">

        <input id="title" placeholder="Kino nomi">

        <input id="genre" placeholder="Janr: action">

        <input id="year" type="number" placeholder="Yil">

        <input id="rating"
               type="number"
               step="0.1"
               min="0"
               max="10"
               placeholder="Reyting">

        <input id="quality"
               placeholder="Sifat: 4K / Full HD / HD">

        <input id="poster"
               placeholder="Poster URL">

        <input id="video_url"
               placeholder="Video URL">

    </div>

    <textarea id="description"
              placeholder="Kino haqida qisqacha ma'lumot"></textarea>

    <label class="vip-toggle">
        <input id="is_vip" type="checkbox">
        <span></span>
        <strong>👑 VIP kino</strong>
    </label>

    <div class="form-actions">
        <button class="primary" onclick="saveMovie()">
            💾 Saqlash
        </button>

        <button onclick="resetForm()">
            Bekor qilish
        </button>
    </div>

</section>


<section class="panel">

    <div class="movies-header">

        <div>
            <h2>🎞️ Kinolar</h2>
            <p id="movieCount">0 ta kino</p>
        </div>

        <button onclick="loadMovies()">↻</button>

    </div>


    <div class="filters">

        <input id="search"
               placeholder="🔎 Kino qidirish..."
               oninput="filterMovies()">

        <select id="genreFilter"
                onchange="filterMovies()">

            <option value="">Barcha janrlar</option>

        </select>

        <select id="vipFilter"
                onchange="filterMovies()">

            <option value="">Barchasi</option>
            <option value="1">👑 VIP</option>
            <option value="0">🆓 Free</option>

        </select>

    </div>


    <div id="movieList" class="movie-list"></div>

</section>

</main>

<div id="toast"></div>

<script src="admin.js"></script>

</body>
</html>
